name: Build Optum APK Pilot

on:
  push:
    branches:
      - optum-apk-pilot
    paths:
      - "optum-apk-pilot/**"
      - ".github/workflows/optum-apk-pilot.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK shell
        working-directory: optum-apk-pilot
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK shell
        uses: actions/upload-artifact@v4
        with:
          name: optum-apk-pilot-shell
          path: optum-apk-pilot/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
